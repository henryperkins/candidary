name: CI

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base revision for migration change detection
        required: true
        default: origin/main

permissions:
  contents: read

jobs:
  local-ci:
    name: Six-lane CI
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WORKERS_CI_BRANCH: ${{ github.ref_name }}
      CI_LOCAL_BASE: ${{ inputs.base }}
      CI_LOCAL_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run ci:local -- --base "$CI_LOCAL_BASE" --head "$CI_LOCAL_HEAD"
