<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <title>Warm Linen</title>
  <desc>Quiet woven neutral with soft directional light. No people, typography, logo, venue, or event prop.</desc>
  <!--
    Every filter pins color-interpolation-filters="sRGB" and every feTurbulence
    pins a seed, so rasterizing this file twice produces the same bytes. The
    weave is two single-octave turbulences at opposite anisotropies: one warp
    running across the frame, one weft running down it.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e5d4"/>
      <stop offset="0.52" stop-color="#e3d5c0"/>
      <stop offset="1" stop-color="#d3c1a7"/>
    </linearGradient>
    <radialGradient id="light" cx="0.26" cy="0.18" r="0.92">
      <stop offset="0" stop-color="#fffaf3" stop-opacity="0.68"/>
      <stop offset="0.45" stop-color="#fffaf3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7a6446" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="warp" filterUnits="userSpaceOnUse" x="0" y="0" width="2400" height="1600"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.36 0.010" numOctaves="1" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.27  0 0 0 0 0.18  0 0 0 0.26 0"/>
    </filter>
    <filter id="weft" filterUnits="userSpaceOnUse" x="0" y="0" width="2400" height="1600"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.010 0.36" numOctaves="1" seed="23"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.23  0 0 0 0.20 0"/>
    </filter>
    <filter id="slub" filterUnits="userSpaceOnUse" x="0" y="0" width="2400" height="1600"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0016" numOctaves="3" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.28  0 0 0 0 0.21  0 0 0 0 0.14  0 0 0 0.16 0"/>
    </filter>
  </defs>
  <rect width="2400" height="1600" fill="url(#ground)"/>
  <rect width="2400" height="1600" fill="none" filter="url(#slub)"/>
  <rect width="2400" height="1600" fill="none" filter="url(#warp)"/>
  <rect width="2400" height="1600" fill="none" filter="url(#weft)"/>
  <rect width="2400" height="1600" fill="url(#light)"/>
</svg>
