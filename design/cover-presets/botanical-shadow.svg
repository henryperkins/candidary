<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <title>Botanical Shadow</title>
  <desc>Diffuse leaf shadow over tactile paper. Abstract foliage silhouettes only: no people, typography, logo, venue, or event prop.</desc>
  <!--
    Sprigs rather than blobs: a leaf is a pointed blade and the stems carry them,
    so the frame still reads as cast foliage after the 2400px master is resampled
    down to a 360px profile. The near layer is only lightly blurred for that
    reason; the far layer keeps the diffuse depth the name promises.

    Every sprig sits inside x 320-2080 and y 180-1420. A centred crop of the
    tallest profile keeps the middle 1486px of width and the widest keeps the
    middle 1120px of height, so nothing is composed into a band some profile cuts.
  -->
  <defs>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6efe3"/>
      <stop offset="0.6" stop-color="#efe6d6"/>
      <stop offset="1" stop-color="#e2d6c2"/>
    </linearGradient>
    <filter id="fibre" filterUnits="userSpaceOnUse" x="0" y="0" width="2400" height="1600"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="3" seed="31"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0.15 0"/>
    </filter>
    <filter id="cast" filterUnits="userSpaceOnUse" x="-300" y="-300" width="3000" height="2200"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <filter id="cast-far" filterUnits="userSpaceOnUse" x="-300" y="-300" width="3000" height="2200"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <radialGradient id="pool" cx="0.34" cy="0.26" r="0.86">
      <stop offset="0" stop-color="#fffaf3" stop-opacity="0.46"/>
      <stop offset="0.55" stop-color="#fffaf3" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5c5138" stop-opacity="0.28"/>
    </radialGradient>
    <path id="leaf" d="M0 0 C 66 -58 198 -66 302 0 C 198 66 66 58 0 0 Z"/>
    <g id="sprig">
      <path d="M0 0 C 210 -34 470 -78 700 -150" stroke-width="11" stroke-linecap="round" fill="none"/>
      <use href="#leaf" transform="translate(96 -14) rotate(-44) scale(0.66)"/>
      <use href="#leaf" transform="translate(150 -22) rotate(28) scale(0.6)"/>
      <use href="#leaf" transform="translate(286 -46) rotate(-52) scale(0.78)"/>
      <use href="#leaf" transform="translate(342 -56) rotate(22) scale(0.7)"/>
      <use href="#leaf" transform="translate(486 -88) rotate(-38) scale(0.62)"/>
      <use href="#leaf" transform="translate(530 -100) rotate(34) scale(0.56)"/>
      <use href="#leaf" transform="translate(668 -142) rotate(-16) scale(0.48)"/>
    </g>
  </defs>
  <rect width="2400" height="1600" fill="url(#paper)"/>
  <g fill="#4a3f2a" stroke="#4a3f2a" opacity="0.17" filter="url(#cast-far)">
    <use href="#sprig" transform="translate(470 1330) rotate(-28) scale(1.5)"/>
    <use href="#sprig" transform="translate(2050 300) rotate(152) scale(1.3)"/>
  </g>
  <g fill="#3b3222" stroke="#3b3222" opacity="0.23" filter="url(#cast)">
    <use href="#sprig" transform="translate(360 560) rotate(14) scale(1.1)"/>
    <use href="#sprig" transform="translate(1980 1240) rotate(-166) scale(1.25)"/>
    <use href="#sprig" transform="translate(1120 980) rotate(-58) scale(0.85)"/>
    <use href="#sprig" transform="translate(1460 260) rotate(64) scale(0.72)"/>
  </g>
  <rect width="2400" height="1600" fill="none" filter="url(#fibre)"/>
  <rect width="2400" height="1600" fill="url(#pool)"/>
</svg>
